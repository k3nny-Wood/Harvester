[package]
name = "harvester-server"
description = "Harvester without a window: the Telegram bot, the alerts and the scanner, and optionally the web page, for a machine that runs all day (a server, or a PC that is left on)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
harvester-core = { path = "../harvester-core" }
harvester-engine = { path = "../harvester-engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
dotenvy = "0.15"
serde_json.workspace = true
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
tower-http = { version = "0.5", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
