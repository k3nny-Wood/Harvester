[workspace]
members = ["crates/harvester-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = ""
authors = ["Harvester contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-str"] }
thiserror = "1"

[profile.release]
lto = "thin"
codegen-units = 4
